[project]
name = "avtv"
version = "0.1.0"
description = ""
authors = [
    {name = "caiorodrigo1",email = "caiorsantosm@gmail.com"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "typer (>=0.25.0,<0.26.0)",
    "pydantic (>=2.13.3,<3.0.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "anthropic (>=0.39)",
    "openai (>=1.50)",
    "ffmpeg-python (>=0.2.0,<0.3.0)",
    "internetarchive (>=5.8.0,<6.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "tenacity (>=9.1.4,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "respx (>=0.23.1,<0.24.0)",
    "ruff (>=0.15.12,<0.16.0)",
    "mypy (>=1.20.2,<2.0.0)"
]

[tool.poetry]
packages = [{include = "avtv", from = "src"}]

[tool.poetry.scripts]
avtv = "avtv.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
